name: pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write   # the daily snapshot branch
  actions: write    # re-enable this workflow (schedule keep-alive)
  discussions: read # the giscus category id (GraphQL read)
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build status.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/status.py "${{ github.repository_owner }}" status.json "${{ github.repository }}"
      - name: Refuse a degraded status.json
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        # a scheduled or manual run must not replace good data on the site with data that lacks several API answers;
        # the previous deployment stays. A push still deploys, and the page shows how many calls failed.
        run: |
          errors=$(python3 -c 'import json; print(json.load(open("status.json")).get("errors", 0))')
          echo "failed API calls: $errors"
          if [ "$errors" -gt 3 ]; then echo "too many failed calls, keeping the previous deployment"; exit 1; fi
      - name: Daily snapshot commit (repository activity, history of the status)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        continue-on-error: true
        run: |
          # at most once a day: skip when the snapshot branch has a commit from the last 20 hours
          last=$(gh api "repos/$REPO/commits?sha=snapshot&per_page=1" -q '.[0].commit.committer.date' 2>/dev/null || true)
          if [ -n "$last" ] && [ $(( $(date -u +%s) - $(date -u -d "$last" +%s) )) -lt 72000 ]; then exit 0; fi
          # GitHub disables scheduled workflows after 60 days without repository activity. Enabling the workflow through
          # the API is the documented call; whether it resets that timer is not confirmed, so the page also shows how old
          # its data is and this step makes a commit a day. The call now runs once a day with the snapshot, not every run.
          gh api -X PUT "repos/$REPO/actions/workflows/pages.yml/enable" || echo "enable call failed"
          if ! gh api "repos/$REPO/git/ref/heads/snapshot" >/dev/null 2>&1; then
            gh api -X POST "repos/$REPO/git/refs" -f ref=refs/heads/snapshot -f sha="$GITHUB_SHA" >/dev/null
          fi
          sha=$(gh api "repos/$REPO/contents/status.json?ref=snapshot" -q .sha 2>/dev/null || true)
          gh api -X PUT "repos/$REPO/contents/status.json" -f message="Status snapshot $(date -u +%F)" \
            -f content="$(base64 -w0 status.json)" -f branch=snapshot ${sha:+-f sha="$sha"} >/dev/null
      - name: Collect the site
        run: mkdir _site && cp index.html docs.html re-psn.html ps3recomp.html 404.html style.css app.js play.js re-psn.json ps3recomp.json status.json _site/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
      - id: deployment
        # GitHub sometimes answers "No artifacts named github-pages" right after the upload succeeded. The artifact is there,
        # so one more attempt in the same run (no rebuild) is enough; the job fails only if that attempt fails too.
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      - name: Wait before the second deploy attempt
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
